# Offline test defaults for the OCR/matching service.
# The synthetic invoice corpus is deterministic and needs no external services.
# Suites that call Oracle / LiteLLM / Paperless are marked "live" and skipped here:
#   pytest -m live            # run them on purpose
[pytest]
testpaths = tests
norecursedirs = .venv __pycache__ .pytest_cache node_modules pdfs _raw
markers =
    live: requires live Oracle EBS / LiteLLM / Paperless endpoints (deselected by default)
addopts = -m "not live" -ra
