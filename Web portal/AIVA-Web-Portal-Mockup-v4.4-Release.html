let act=null;

const REASON={explain:["เอกสารถูกต้อง ระบบอ่านผิด","ผู้ขายจะส่งใบลดหนี้"],resubmit:["ขอลายเซ็นผู้รับของแล้ว สแกนใหม่","ยกเลิกแล้วทำรับใหม่ใน Oracle","สแกนใหม่ครบทุกหน้า"],rerun:["ผู้ใช้งานทำรับใน Oracle แล้ว","ผู้ใช้งานสแกนใหม่แล้ว"],

 const high=d.rules.some(r=>r.result===F&&r.severity==="High");if(act==="confirm"&&high&&!nt)return toast("กรุณาระบุหมายเหตุ",1);

 else if(act==="explain"){d.assigned="acc";msg="ส่งคำชี้แจงแล้ว"}
 else if(act==="return"){d.assigned="eu";msg="ส่งกลับ "+d.owner+" แล้ว"}
 else if(act==="reject"){d.status="Rejected";k="c";msg="ปฏิเสธแล้ว"}
 else if(act==="hold"){d.status="Hold";k="c";msg="Hold แล้ว"}

  d.hist.push({t:now(),a:"Portal ตรวจเอกสารซ้ำก่อนส่ง",d:"ไม่พบซ้ำ",k:"s"});d.status="Posted";k="g";msg="ส่งเข้า AP Interface แล้ว"}
 if(act!=="resubmit"&&act!=="rerun")d.hist.push({t:now(),a:CFG[act][0],d:who+" · "+rs+(nt?" · "+nt:""),k});
 log(CFG[act][0],d.doc,rs);closeM();toast(msg);render()}

 <table><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>บทบาท</th><th>การดำเนินการ</th><th>เอกสาร</th><th>รายละเอียด</th></tr></thead><tbody>${AUDIT.map(a=>`<tr><td class="mono">${a.t}</td><td>${a.who}</td><td>${a.role}</td><td>${a.act}</td><td class="mono">${a.doc}</td><td>${a.detail}</td></tr>`).join("")}</tbody></table></div></div></div>`}
init();
</script>
